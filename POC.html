<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sentry Replay POC</title>

  <!-- Sentry Loader -->
  <script
    src="https://js.sentry-cdn.com/52c193564539fdeb2558e110b6a5be9b.min.js"
    crossorigin="anonymous">
  </script>

  <script>
    window.sentryOnLoad = function () {
      Sentry.init({
        dsn: "https://52c193564539fdeb2558e110b6a5be9b@o4510698684416000.ingest.us.sentry.io/4510783707348992",

        integrations: [
          Sentry.replayIntegration()
        ],

        // ⬅️ دول أهم سطرين
        replaysSessionSampleRate: 1.0, // record every session
        replaysOnErrorSampleRate: 1.0, // record when error happens

        sendDefaultPii: true,
      });

      console.log("✅ Sentry + Replay initialized");
      // KEEP

      // ⏱️ Auto error after page load
      setTimeout(function () {
        try {
          throw new Error("⏱️ Auto Error After Load");
        } catch (err) {
          Sentry.captureException(err);
        }
      }, 1000);
    };
  </script>
</head>

<body>
  <h1>Sentry Session Replay – POC</h1>

  <button id="attachment">Trigger Attachment Error</button>
  <button id="error">Trigger Browser POC Error</button>

  <script>
    document.getElementById("attachment").addEventListener("click", () => {
      try { throw new Error("📎 Error With Attachment"); } catch (e) { Sentry.captureException(e); }
    });

    document.getElementById("error").addEventListener("click", function () {
      try {
        throw new Error("🔥 Browser POC Error");
      } catch (e) {
        Sentry.captureException(e);
      }
    });

  </script>
</body>
</html>
